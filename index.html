<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
#root{height:100vh;width:100vw;overflow:hidden}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:#f0f2f8;color:#374151}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit;box-sizing:border-box}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#eee}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

.cell-drop{transition:all 0.12s ease}
.cell-drop.drag-over{background:#FEF3C7 !important;outline:2px dashed #F59E0B;outline-offset:-2px}

.action:disabled{opacity:.5;cursor:default}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:0}

<script type="text/babel">
const {useState,useMemo,useCallback,useRef,useEffect}=React;

/* ════════════════════════════════════════════════
   データ定義
════════════════════════════════════════════════ */
const DEFAULT_SUBJECTS=[
  {id:'kokugo',name:'国語',color:'#FF6B6B',short:'国'},
  {id:'sansu',name:'算数',color:'#4ECDC4',short:'算'},
  {id:'seikatsu',name:'生活',color:'#69B96E',short:'生'},
  {id:'rika',name:'理科',color:'#95E1D3',short:'理'},
  {id:'shakai',name:'社会',color:'#FFD93D',short:'社'},
  {id:'taiiku',name:'体育',color:'#FF9F43',short:'体'},
  {id:'ongaku',name:'音楽',color:'#A55EEA',short:'音'},
  {id:'zukou',name:'図工',color:'#54A0FF',short:'図'},
  {id:'katei',name:'家庭',color:'#26DE81',short:'家'},
  {id:'doutoku',name:'道徳',color:'#FD79A8',short:'道'},
  {id:'gaikoku',name:'外国語',color:'#6C5CE7',short:'外'},
  {id:'gaikoku_katsudo',name:'外国語活動',color:'#7375B9',short:'外活'},
  {id:'sougou',name:'総合',color:'#00B894',short:'総'},
  {id:'tokkatsu',name:'学活',color:'#FDCB6E',short:'活'},
];
const WEEKDAYS=['月','火','水','木','金'];
const PERIODS=['1','2','3','4','5','6'];

/* 平成29年改訂の年間標準時数。学校独自の配当は標準とは別に保持する。 */
/* TODO(第2層): schoolHourTargets を追加し、学校配当と標準を並べて比較する。 */
const STANDARD_HOURS={
  1:{kokugo:306,sansu:136,seikatsu:102,ongaku:68,zukou:68,taiiku:102,doutoku:34,tokkatsu:34},
  2:{kokugo:315,sansu:175,seikatsu:105,ongaku:70,zukou:70,taiiku:105,doutoku:35,tokkatsu:35},
  3:{kokugo:245,shakai:70,sansu:175,rika:90,ongaku:60,zukou:60,taiiku:105,doutoku:35,gaikoku_katsudo:35,sougou:70,tokkatsu:35},
  4:{kokugo:245,shakai:90,sansu:175,rika:105,ongaku:60,zukou:60,taiiku:105,doutoku:35,gaikoku_katsudo:35,sougou:70,tokkatsu:35},
  5:{kokugo:175,shakai:100,sansu:175,rika:105,ongaku:50,zukou:50,katei:60,taiiku:90,doutoku:35,gaikoku:70,sougou:70,tokkatsu:35},
  6:{kokugo:175,shakai:105,sansu:175,rika:105,ongaku:50,zukou:50,katei:55,taiiku:90,doutoku:35,gaikoku:70,sougou:70,tokkatsu:35}
};

/* AIプロンプト雛形 */
const PROMPT_TEMPLATES=[
  {id:'lesson',label:'授業展開',gen:(g,sub,unit,sb)=>`小学${g}年生の${sub}「${unit}」${sb?`の「${sb}」`:''}の授業を計画しています。\n45分の授業展開を、①めあて ②導入(5分) ③展開(30分・主な発問と予想される児童の反応) ④まとめ(10分) の形で具体的に提案してください。`},
  {id:'board',label:'板書計画',gen:(g,sub,unit,sb)=>`小学${g}年生の${sub}「${unit}」${sb?`の「${sb}」`:''}の板書計画を作ってください。\nめあて・子どもの考え・まとめが一目でわかる、黒板のレイアウトを文字と配置で示してください。`},
  {id:'worksheet',label:'ワークシート案',gen:(g,sub,unit,sb)=>`小学${g}年生の${sub}「${unit}」${sb?`の「${sb}」`:''}で使うワークシートの案を作ってください。\n児童が考えを書き込めるよう、問い・記入欄・ヒントを含めた構成にしてください。`},
  {id:'rubric',label:'評価規準',gen:(g,sub,unit,sb)=>`小学${g}年生の${sub}「${unit}」${sb?`の「${sb}」`:''}の評価規準を作ってください。\n「知識・技能」「思考・判断・表現」「主体的に学習に取り組む態度」の3観点で、具体的な評価の視点を示してください。`},
];

/* ════════════════════════════════════════════════
   日付ユーティリティ
════════════════════════════════════════════════ */
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const getMonday=d=>{const x=new Date(d);const day=x.getDay();const diff=day===0?-6:1-day;return addDays(x,diff)};
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;

const STORAGE_KEY='weeklyPlan_v2';
const isRecord=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const clone=v=>JSON.parse(JSON.stringify(v));
const today=()=>toKey(new Date());
const schoolYearOf=key=>Number(key.slice(0,4))-(Number(key.slice(5,7))<4?1:0);
const inSchoolYear=(key,year)=>key>=`${year}-04-01`&&key<`${year+1}-04-01`;
const formatHours=n=>Number(n.toFixed(2)).toLocaleString('ja-JP');
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
function validDate(key){
  if(typeof key!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(key))return false;
  const year=Number(key.slice(0,4));
  return year>=1900&&year<=2200&&toKey(parseKey(key))===key;
}
function stableId(text){
  return 'key-'+Array.from(text).map(c=>c.codePointAt(0).toString(16)).join('-');
}
function safeUrl(value){
  try{const u=new URL(String(value));return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}
}
function createInitialState(){
  return {version:2,meta:{grade:5,className:'1',teacherName:'',schoolYear:schoolYearOf(today())},subjects:clone(DEFAULT_SUBJECTS),events:{},weeks:{},tasks:[],curriculum:[]};
}
// 破損データは黙って上書きせず、呼出側で保存停止と原本の書出を行う。
function normalizePlan(raw){
  if(!isRecord(raw)||![1,2].includes(raw.version))throw new Error('対応していない保存形式です');
  if(raw.meta!=null&&!isRecord(raw.meta))throw new Error('設定データの形式が不正です');
  const initial=createInitialState();
  const meta={...initial.meta,...raw.meta};
  if(!Number.isInteger(Number(meta.grade))||meta.grade<1||meta.grade>6)throw new Error('学年の形式が不正です');
  if(!Number.isInteger(Number(meta.schoolYear))||meta.schoolYear<1900||meta.schoolYear>2199)throw new Error('年度の形式が不正です');
  meta.grade=Number(meta.grade);meta.schoolYear=Number(meta.schoolYear);
  meta.className=String(meta.className??'');meta.teacherName=String(meta.teacherName??'');
  const entries=Array.isArray(raw.subjects)?raw.subjects:isRecord(raw.subjects)?Object.entries(raw.subjects).map(([id,s])=>({...s,id})):initial.subjects;
  const subjectMap=new Map(DEFAULT_SUBJECTS.map(s=>[s.id,{...s}]));
  entries.forEach(s=>{
    if(!isRecord(s)||typeof s.id!=='string'||!/^[a-z][a-z0-9_-]*$/.test(s.id))throw new Error('教科データの形式が不正です');
    const base=subjectMap.get(s.id)||{color:'#7B8494',short:''};
    subjectMap.set(s.id,{...base,id:s.id,name:String(s.name||base.name||s.id),short:String(s.short||base.short||s.name||s.id),color:/^#[\da-f]{6}$/i.test(s.color)?s.color:base.color});
  });
  const events={};
  if(raw.events!=null&&!isRecord(raw.events))throw new Error('行事データの形式が不正です');
  Object.entries(raw.events||{}).forEach(([date,list])=>{
    if(!validDate(date)||!Array.isArray(list))throw new Error('行事の日付・配列が不正です');
    events[date]=list.map(ev=>{
      if(!isRecord(ev)||typeof ev.title!=='string')throw new Error('行事名の形式が不正です');
      if(ev.id!=null&&(typeof ev.id!=='string'||!ev.id))throw new Error('行事IDの形式が不正です');
      const type=['school','gakunen','holiday'].includes(ev.type)?ev.type:'school';
      return {...ev,id:ev.id||stableId(`${date}|${type}|${ev.title.trim()}`),title:ev.title.trim(),type};
    });
  });
  const weeks={};
  if(raw.weeks!=null&&!isRecord(raw.weeks))throw new Error('週案データの形式が不正です');
  Object.entries(raw.weeks||{}).forEach(([key,week])=>{
    if(!validDate(key)||parseKey(key).getDay()!==1||!isRecord(week)||!isRecord(week.days))throw new Error('週案の週・日付の形式が不正です');
    const grade=Number(week.grade??meta.grade);
    if(!Number.isInteger(grade)||grade<1||grade>6)throw new Error('週案の学年が不正です');
    const days={};
    Object.entries(week.days).forEach(([date,day])=>{
      if(!validDate(date)||date<key||date>toKey(addDays(parseKey(key),4))||!isRecord(day)||!isRecord(day.periods))throw new Error('週案のコマ形式が不正です');
      const periods={};
      PERIODS.forEach(p=>{
        const slot=day.periods[p];
        if(slot==null){periods[p]=null;return}
        if(!isRecord(slot)||typeof slot.subjectId!=='string')throw new Error('教科参照が不正です');
        let subjectId=slot.subjectId;
        if(raw.version===1&&[3,4].includes(grade)&&subjectId==='gaikoku')subjectId='gaikoku_katsudo';
        const minutes=Number(slot.minutes??45);
        if(!Number.isFinite(minutes)||minutes<=0||minutes>180)throw new Error('授業分数が不正です');
        if(slot.status!=null&&!['planned','done','cancelled'].includes(slot.status))throw new Error('実施状態が不正です');
        if(slot.curriculumUnitId!=null&&typeof slot.curriculumUnitId!=='string')throw new Error('単元参照の形式が不正です');
        periods[p]={...slot,subjectId,unit:String(slot.unit??''),sub:String(slot.sub??''),items:String(slot.items??''),memo:String(slot.memo??''),status:slot.status||'planned',minutes,curriculumUnitId:slot.curriculumUnitId||null};
      });
      days[date]={gyozen:{text:String(day.gyozen?.text??'')},periods};
    });
    weeks[key]={weekStart:key,grade,days};
  });
  if(raw.tasks!=null&&!Array.isArray(raw.tasks))throw new Error('タスクの形式が不正です');
  const tasks=(raw.tasks||[]).map(t=>{
    if(!isRecord(t)||typeof t.text!=='string'||!validDate(t.date))throw new Error('タスクの形式が不正です');
    return {...t,id:String(t.id||uid()),done:!!t.done};
  });
  if(raw.curriculum!=null&&!Array.isArray(raw.curriculum))throw new Error('指導計画の形式が不正です');
  const curriculum=(raw.curriculum||[]).map(c=>{
    if(!isRecord(c)||typeof c.id!=='string'||typeof c.subjectId!=='string'||!Array.isArray(c.units)||!Number.isInteger(c.grade)||c.grade<1||c.grade>6||!Number.isInteger(c.schoolYear))throw new Error('指導計画の形式が不正です');
    const units=c.units.map(u=>{
      if(!isRecord(u)||typeof u.id!=='string'||typeof u.title!=='string'||!Number.isFinite(u.plannedHours)||u.plannedHours<=0)throw new Error('単元データが不正です');
      if(u.month!=null&&(!Number.isInteger(u.month)||u.month<1||u.month>12))throw new Error('予定月が不正です');
      if(u.resources!=null&&!Array.isArray(u.resources))throw new Error('教材リンクの形式が不正です');
      return {...u,resources:(u.resources||[]).filter(r=>isRecord(r)&&safeUrl(r.url)).map(r=>({title:String(r.title||r.url),url:safeUrl(r.url)}))};
    });
    if(new Set(units.map(u=>u.id)).size!==units.length)throw new Error('単元IDが重複しています');
    return {...c,publisher:String(c.publisher||''),textbook:String(c.textbook||''),source:String(c.source||''),units};
  });
  if(new Set(curriculum.map(c=>c.id)).size!==curriculum.length||new Set(curriculum.map(c=>`${c.schoolYear}|${c.grade}|${c.subjectId}`)).size!==curriculum.length)throw new Error('同年度・学年・教科の指導計画が重複しています');
  return {version:2,meta,subjects:[...subjectMap.values()],events,weeks,tasks,curriculum};
}
function savePlan(state){
  // TODO(第3層): 本人のDrive保存アダプター。メモ送信は明示的な設定が必要。
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function loadPlan(){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    const legacy=current==null?localStorage.getItem('weeklyPlan_v1'):null;
    const raw=current??legacy;
    return {plan:raw?normalizePlan(JSON.parse(raw)):createInitialState(),error:'',blocked:false,migrated:!!legacy};
  }catch(e){return {plan:createInitialState(),error:`保存データを読み込めません: ${e.message}`,blocked:true,migrated:false}}
}
function downloadText(name,text,type='application/json'){
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportSavedOriginal(){
  try{downloadText('weekly-plan-original.json',localStorage.getItem(STORAGE_KEY)||localStorage.getItem('weeklyPlan_v1')||'{}')}catch(e){alert(e.message)}
}

/* TODO(第3層): tasks を Googleタスクと同期（loadTasks/saveTasks を差し替え） */
function loadTasks(savedState){return savedState?.tasks||[]}
function saveTasks(tasks){return tasks}

/* 日付・学年・実施状態を区別して集計する。 */
function listLessons(weeks,grade,schoolYear){
  const result=[];
  Object.values(weeks).forEach(week=>{
    if(Number(week.grade)!==Number(grade))return;
    Object.entries(week.days).forEach(([date,day])=>{
      if(!inSchoolYear(date,schoolYear))return;
      PERIODS.forEach(period=>{const slot=day.periods[period];if(slot?.subjectId)result.push({...slot,date,period,hours:slot.minutes/45})});
    });
  });
  return result;
}
function calculateHourSummary({subjects,weeks,grade,schoolYear,asOf=today(),todayKey=today()}){
  const standards=STANDARD_HOURS[String(grade)]||STANDARD_HOURS[grade]||{};
  const lessons=listLessons(weeks,grade,schoolYear);
  const ids=new Set([...subjects.map(s=>s.id),...Object.keys(standards),...lessons.map(s=>s.subjectId)]);
  return [...ids].map(id=>{
    const subject=subjects.find(s=>s.id===id)||{id,name:`未登録教科 (${id})`,short:id,color:'#7B8494'};
    const slots=lessons.filter(s=>s.subjectId===id);
    const planned=slots.filter(s=>s.status!=='cancelled').reduce((sum,s)=>sum+s.hours,0);
    const actual=slots.filter(s=>s.status==='done'&&s.date<=asOf&&s.date<=todayKey).reduce((sum,s)=>sum+s.hours,0);
    const standard=Object.prototype.hasOwnProperty.call(standards,subject.id)?standards[subject.id]:null;
    const remaining=standard==null?null:Math.max(0,standard-actual);
    const progress=standard?Math.round((actual/standard)*1000)/10:null;
    return {
      subject,planned,actual,standard,remaining,progress,isOver:standard!=null&&actual>standard
    };
  }).filter(row=>row.planned>0||row.standard!=null);
}

                <div style={{height:'100%',width:`${barWidth}%`,background:row.isOver?'#F59E0B':row.subject.color,borderRadius:99}}/>
              </div>

            </div>
          </div>
        );
      })}

        1単位時間 = 45分

  );
}

/* ════════════════════════════════════════════════
   Excel行事読み込みモーダル
════════════════════════════════════════════════ */
function parseExcelDate(value,year,date1904=false,xlsx=globalThis.XLSX){
  if(value instanceof Date)return validDate(toKey(value))?toKey(value):null;
  if(typeof value==='number'){
    if(!Number.isFinite(value)||(!date1904&&Math.floor(value)===60))return null;
    const d=xlsx?.SSF.parse_date_code(value,{date1904});
    if(!d)return null;
    const key=`${d.y}-${pad(d.m)}-${pad(d.d)}`;return validDate(key)?key:null;
  }
  const s=String(value??'').normalize('NFKC').trim();
  let m=s.match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})(?:日)?(?:\s*[（(][日月火水木金土][)）])?$/);
  if(m){const key=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;return validDate(key)?key:null}
  m=s.match(/^(\d{1,2})[\/\-月](\d{1,2})(?:日)?(?:\s*[（(][日月火水木金土][)）])?$/);
  if(m){const month=+m[1],key=`${Number(year)+(month<4?1:0)}-${pad(month)}-${pad(+m[2])}`;return validDate(key)?key:null}
  return null;
}
function parseMonth(value){
  const m=String(value??'').normalize('NFKC').trim().match(/^(\d{1,2})(?:月)?$/);
  return m&&+m[1]>=1&&+m[1]<=12?+m[1]:null;
}
function parseEventRows({rows,start,end,dateCol,monthCol,dayCol,titleCol,dateMode,year,date1904,type,source}){
  const valid=[],rejected=[];
  for(let i=start;i<=end;i++){
    const r=rows[i]||[];if(!r.some(v=>v!=null&&String(v).trim()))continue;
    const title=String(r[titleCol]??'').trim();
    const date=dateMode==='split'?parseExcelDate(`${String(r[monthCol]??'').replace(/月$/,'')}/${String(r[dayCol]??'').replace(/日$/,'')}`,year):parseExcelDate(r[dateCol],year,date1904);
    if(!date||!title){rejected.push({row:i+1,reason:!date?'日付が不正・未入力':'行事名が未入力'});continue}
    if(!inSchoolYear(date,Number(year))){rejected.push({row:i+1,reason:'選択年度の範囲外'});continue}
    valid.push({date,title,type,source,id:stableId(`${date}|${type}|${title}`)});
  }
  return {valid,rejected};
}
function mergedValue(rows,merges,row,col){
  const value=rows[row]?.[col];if(value!=null&&value!=='')return value;
  const range=merges.find(m=>row>=m.s.r&&row<=m.e.r&&col>=m.s.c&&col<=m.e.c);
  return range?rows[range.s.r]?.[range.s.c]:value;
}
// TODO(第2層): 出版社別アダプターは、この正規化関数に渡す前に追加する。
function parseCurriculumRows({rows,merges,start,end,titleCol,hoursCol,monthCol,planId}){
  const valid=[],rejected=[],occurrences=new Map();
  for(let i=start;i<=end;i++){
    const r=rows[i]||[];if(!r.some(v=>v!=null&&String(v).trim()))continue;
    const title=String(mergedValue(rows,merges,i,Number(titleCol))??'').trim();
    const rawHours=String(r[hoursCol]??'').normalize('NFKC').trim();
    const plannedHours=/^\d+(?:\.\d+)?$/.test(rawHours)?Number(rawHours):NaN;
    const rawMonth=monthCol===''?null:mergedValue(rows,merges,i,Number(monthCol));
    const month=rawMonth==null||rawMonth===''?null:parseMonth(rawMonth);
    if(!title||/^(?:総?合計|小計|計)(?:[\s（(].*)?$/.test(title)||!Number.isFinite(plannedHours)||plannedHours<=0||plannedHours>500||(rawMonth!=null&&rawMonth!==''&&month===null)){
      rejected.push({row:i+1,reason:!title?'単元名が未入力':!Number.isFinite(plannedHours)||plannedHours<=0?'配当時数が不正':'集計行・予定月が不正'});continue;
    }
    const occurrence=(occurrences.get(title)||0)+1;occurrences.set(title,occurrence);
    valid.push({id:stableId(`${planId}|${title}|${occurrence}`),title,plannedHours,month,resources:[]});
  }
  return {valid,rejected};
}
function mergeEvents(previous,entries,mode,year){
  const next=clone(previous);
  if(mode==='replace')Object.keys(next).forEach(date=>{if(inSchoolYear(date,year))delete next[date]});
  entries.forEach(({date,...event})=>{
    if(!next[date])next[date]=[];
    if(!next[date].some(old=>old.id===event.id||(old.title===event.title&&old.type===event.type)))next[date].push(event);
  });
  return next;
}
function Modal({title,onClose,children}){
  const ref=useRef(null);
  useEffect(()=>{
    const previous=document.activeElement;ref.current?.focus();
    const keydown=e=>{
      if(e.key==='Escape')onClose();
      if(e.key==='Tab'){
        const elements=[...ref.current.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled);
        const first=elements[0],last=elements[elements.length-1];
        if(e.shiftKey&&(document.activeElement===first||document.activeElement===ref.current)){e.preventDefault();last?.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
      }
    };
    document.addEventListener('keydown',keydown);return()=>{document.removeEventListener('keydown',keydown);previous?.focus()};
  },[]);
  return <div className="modal-backdrop"><div ref={ref} tabIndex={-1} className="modal" role="dialog" aria-modal="true" aria-label={title}><h3>{title}</h3>{children}</div></div>;
}
function Field({label,children}){
  const id=React.useId();
  return <div className="field"><label htmlFor={id}>{label}</label>{React.cloneElement(children,{id})}</div>;
}
function ExcelImportModal({onClose,onImport,kind='events',meta,subjects}){
  const[workbook,setWorkbook]=useState(null),[sheet,setSheet]=useState(''),[source,setSource]=useState(''),[error,setError]=useState('');
  const[header,setHeader]=useState(1),[lastRow,setLastRow]=useState(1),[mapping,setMapping]=useState({date:'',month:'',day:'',title:'',hours:''});
  const[dateMode,setDateMode]=useState('date'),[mode,setMode]=useState('merge'),[type,setType]=useState('school');
  const[subjectId,setSubjectId]=useState('sansu'),[publisher,setPublisher]=useState(''),[textbook,setTextbook]=useState('');
  const isCurriculum=kind==='curriculum';
  const rows=useMemo(()=>workbook&&sheet?XLSX.utils.sheet_to_json(workbook.Sheets[sheet],{header:1,range:0,raw:true,defval:null,blankrows:true}):[],[workbook,sheet]);
  const columns=rows.length?Array.from({length:Math.max(...rows.map(r=>r.length))},(_,i)=>`${XLSX.utils.encode_col(i)}: ${String(rows[header-1]?.[i]??'').slice(0,50)}`):[];
  const planId=stableId(`${meta.schoolYear}|${meta.grade}|${subjectId}`);
  const required=isCurriculum?['title','hours']:dateMode==='split'?['month','day','title']:['date','title'];
  const ready=rows.length>0&&required.every(k=>mapping[k]!=='')&&new Set(required.map(k=>mapping[k])).size===required.length&&header>=1&&header<lastRow&&lastRow<=rows.length;
  const preview=useMemo(()=>{
    if(!ready)return {valid:[],rejected:[]};
    const options={rows,merges:workbook.Sheets[sheet]['!merges']||[],start:header,end:lastRow-1,titleCol:mapping.title,monthCol:mapping.month};
    return isCurriculum?parseCurriculumRows({...options,hoursCol:mapping.hours,planId}):parseEventRows({...options,dateCol:mapping.date,dayCol:mapping.day,dateMode,year:meta.schoolYear,date1904:!!workbook.Workbook?.WBProps?.date1904,type,source});
  },[rows,workbook,sheet,header,lastRow,mapping,ready,isCurriculum,planId,dateMode,meta.schoolYear,type,source]);
  const handleFile=async e=>{
    const file=e.target.files[0];if(!file)return;setError('');setWorkbook(null);
    try{
      if(!globalThis.XLSX)throw new Error('Excel読み込みライブラリを取得できませんでした');
      if(file.size>10*1024*1024)throw new Error('10MB以下のファイルを選択してください');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
      wb.SheetNames.forEach(name=>{const ref=wb.Sheets[name]['!ref'];if(ref){const range=XLSX.utils.decode_range(ref);if(range.e.r>=20000||range.e.c>=200)throw new Error('シートは20,000行・200列以内にしてください')}});
      setWorkbook(wb);setSource(file.name);setSheet(wb.SheetNames[0]);setHeader(1);setMapping({date:'',month:'',day:'',title:'',hours:''});
      setLastRow(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,range:0,blankrows:true}).length);
    }catch(e){setError(`読み込めません: ${e.message}`)}
  };
  const colSelect=(key,label)=><Field label={label}><select value={mapping[key]} onChange={e=>setMapping(m=>({...m,[key]:e.target.value}))}><option value="">未指定</option>{columns.map((label,i)=><option key={i} value={i}>{label}</option>)}</select></Field>;
  const importData=()=>{
    if(isCurriculum)onImport({id:planId,subjectId,grade:meta.grade,schoolYear:meta.schoolYear,publisher:publisher.trim(),textbook:textbook.trim(),source,units:preview.valid});
    else onImport(preview.valid,mode);
  };
  return <Modal title={isCurriculum?'年間指導計画 Excel 取込':'年間学校行事 Excel 取込'} onClose={onClose}>
    <div className="muted">{meta.schoolYear}年度・{meta.grade}年</div>
    <Field label="Excelファイル"><input type="file" accept=".xlsx,.xls" onChange={handleFile}/></Field>
    {error&&<p className="error-text" role="alert">{error}</p>}
    {workbook&&<>
      <div className="fields">
        <Field label="シート"><select value={sheet} onChange={e=>{setSheet(e.target.value);setMapping({date:'',month:'',day:'',title:'',hours:''});setHeader(1);setLastRow(XLSX.utils.sheet_to_json(workbook.Sheets[e.target.value],{header:1,range:0,blankrows:true}).length)}}>{workbook.SheetNames.map(n=><option key={n}>{n}</option>)}</select></Field>
        <Field label="見出し行"><input type="number" min="1" max={rows.length} value={header} onChange={e=>setHeader(Number(e.target.value))}/></Field>
        <Field label="最終データ行"><input type="number" min={header+1} max={rows.length} value={lastRow} onChange={e=>setLastRow(Number(e.target.value))}/></Field>
        {!isCurriculum&&<Field label="日付形式"><select value={dateMode} onChange={e=>setDateMode(e.target.value)}><option value="date">日付列</option><option value="split">月・日を別の列から指定</option></select></Field>}
        {isCurriculum?<>
          <Field label="教科"><select value={subjectId} onChange={e=>setSubjectId(e.target.value)}>{subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
          <Field label="出版社"><input value={publisher} onChange={e=>setPublisher(e.target.value)}/></Field>
          <Field label="教科書名・版"><input value={textbook} onChange={e=>setTextbook(e.target.value)}/></Field>
          {colSelect('title','単元名の列')}{colSelect('hours','配当時数の列')}{colSelect('month','予定月の列（任意）')}
        </>:<>
          {dateMode==='date'?colSelect('date','日付の列'):<>{colSelect('month','月の列')}{colSelect('day','日の列')}</>}
          {colSelect('title','行事名の列')}
          <Field label="行事種別"><select value={type} onChange={e=>setType(e.target.value)}><option value="school">学校行事</option><option value="gakunen">学年行事</option><option value="holiday">休業日</option></select></Field>
          <Field label="取込方法"><select value={mode} onChange={e=>setMode(e.target.value)}><option value="merge">追加（重複除外）</option><option value="replace">選択年度の行事を置換</option></select></Field>
        </>}
      </div>
      <div className="table-scroll" style={{maxHeight:140}}><table className="data-table"><tbody>{rows.slice(Math.max(0,header-1),header+3).map((r,i)=><tr key={i}><th>{header+i}</th>{columns.map((_,j)=><td key={j}>{String(r[j]??'').slice(0,60)}</td>)}</tr>)}</tbody></table></div>
      <p style={{fontSize:12,margin:'12px 0'}}>有効 {preview.valid.length}件 / 除外 {preview.rejected.length}件</p>
      <div style={{maxHeight:160,overflow:'auto'}}>
        {preview.valid.slice(0,20).map((p,i)=><div key={i} style={{fontSize:12,padding:3}}>{isCurriculum?`${p.month?p.month+'月':'月未設定'} / ${p.plannedHours}時`:p.date}　{p.title}</div>)}
        {preview.rejected.slice(0,15).map(r=><div key={r.row} className="error-text">{r.row}行: {r.reason}</div>)}
      </div>

    </>}
    <div className="modal-actions"><button className="action" onClick={onClose}>キャンセル</button><button className="action" disabled={!ready||!preview.valid.length} onClick={()=>{
      if((isCurriculum||mode==='replace')&&!confirm('既存の計画を置き換えます。プレビュー内容で確定しますか？'))return;importData();
    }}>取り込みを確定</button></div>
  </Modal>;
}

function buildICS(events,schoolYear,now=new Date()){
  const escape=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Weekly Planner//School Events//JA','CALSCALE:GREGORIAN'];
  Object.keys(events).sort().filter(date=>inSchoolYear(date,schoolYear)).forEach(date=>events[date].forEach(ev=>{
    lines.push('BEGIN:VEVENT',`UID:${ev.id}@weekly-planner.local`,`DTSTAMP:${now.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}`,`DTSTART;VALUE=DATE:${date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${toKey(addDays(parseKey(date),1)).replace(/-/g,'')}`,`SUMMARY:${escape(ev.title)}`,'END:VEVENT');
  }));
  lines.push('END:VCALENDAR');
  return lines.map(line=>{
    let folded='',part='',bytes=0;
    for(const char of line){const size=new TextEncoder().encode(char).length;if(bytes+size>75){folded+=part+'\r\n';part=' ';bytes=1}part+=char;bytes+=size}
    return folded+part;
  }).join('\r\n')+'\r\n';
}

function calculateCurriculumProgress(plan,lessons,asOf,todayKey=today()){
  const actual=lessons.filter(s=>s.status==='done'&&s.date<=asOf&&s.date<=todayKey);
  const known=new Set(plan.units.map(u=>u.id));
  const rank=m=>(m+8)%12;
  const referenceRank=inSchoolYear(asOf,plan.schoolYear)?rank(Number(asOf.slice(5,7))):asOf<`${plan.schoolYear}-04-01`?-1:11;
  const rows=plan.units.map(unit=>{
    const count=actual.filter(s=>s.curriculumUnitId===unit.id).reduce((sum,s)=>sum+s.hours,0);
    const planned=lessons.filter(s=>s.status!=='cancelled'&&s.curriculumUnitId===unit.id).reduce((sum,s)=>sum+s.hours,0);
    return {...unit,actual:count,planned,progress:count/unit.plannedHours*100};
  });
  const target=plan.units.filter(u=>u.month!=null&&rank(u.month)<=referenceRank).reduce((sum,u)=>sum+u.plannedHours,0);
  const linked=actual.filter(s=>known.has(s.curriculumUnitId)).reduce((sum,s)=>sum+s.hours,0);
  // 月未設定単元の実施を、月末目安との進度差に混ぜない。
  const datedIds=new Set(plan.units.filter(u=>u.month!=null).map(u=>u.id));
  const datedActual=actual.filter(s=>datedIds.has(s.curriculumUnitId)).reduce((sum,s)=>sum+s.hours,0);
  return {rows,target,linked,datedActual,unlinked:actual.filter(s=>!known.has(s.curriculumUnitId)).reduce((sum,s)=>sum+s.hours,0),undated:plan.units.filter(u=>u.month==null).length};
}

function App(){
  const[loaded]=useState(loadPlan);
  const[meta,setMeta]=useState(loaded.plan.meta);
  const[subjects,setSubjects]=useState(loaded.plan.subjects);
  const[events,setEvents]=useState(loaded.plan.events);

  const[tasks,setTasks]=useState(()=>loadTasks(loaded.plan));
  const[curriculum,setCurriculum]=useState(loaded.plan.curriculum);
  const[storageError,setStorageError]=useState(loaded.error);
  const[storageBlocked,setStorageBlocked]=useState(loaded.blocked);
  const[view,setView]=useState('week');
  const[eventDate,setEventDate]=useState(null);
  const[resource,setResource]=useState(null);
  const[notice,setNotice]=useState(loaded.migrated?'旧形式のデータを移行しました。v1の保存原本は保持しています。':'');
  const[weekStart,setWeekStart]=useState(()=>toKey(getMonday(parseKey(inSchoolYear(today(),meta.schoolYear)?today():`${meta.schoolYear}-04-01`))));
  const[editCell,setEditCell]=useState(null);
  const[showExcel,setShowExcel]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[taskInput,setTaskInput]=useState('');
  const[dragSubject,setDragSubject]=useState(null);

  const state=useMemo(()=>({version:2,meta,subjects,events,weeks,tasks:saveTasks(tasks),curriculum}),[meta,subjects,events,weeks,tasks,curriculum]);
  const stateRef=useRef(state);stateRef.current=state;
  const blockedRef=useRef(storageBlocked);blockedRef.current=storageBlocked;
  useEffect(()=>{
    if(storageBlocked)return;
    const timer=setTimeout(()=>{try{savePlan(state);setStorageError('')}catch(e){setStorageError(`端末に保存できません: ${e.message}。JSONバックアップを取得してください。`)}},500);
    return()=>clearTimeout(timer);
  },[state,storageBlocked]);
  useEffect(()=>{
    const flush=()=>{if(!blockedRef.current){try{savePlan(stateRef.current)}catch{}}};
    const changed=e=>{if(e.key===STORAGE_KEY&&e.newValue!==JSON.stringify(stateRef.current)){blockedRef.current=true;setStorageBlocked(true);setStorageError('別のタブで保存データが変更されました。この画面の自動保存を停止しました。JSONを書き出してから再読み込みしてください。')}};
    window.addEventListener('beforeunload',flush);window.addEventListener('storage',changed);
    return()=>{window.removeEventListener('beforeunload',flush);window.removeEventListener('storage',changed)};
  },[]);
  useEffect(()=>{
    if(!WEEKDAYS.some((_,i)=>inSchoolYear(toKey(addDays(parseKey(weekStart),i)),meta.schoolYear)))setWeekStart(toKey(getMonday(parseKey(`${meta.schoolYear}-04-01`))));
  },[meta.schoolYear]);
  const restore=plan=>{setMeta(plan.meta);setSubjects(plan.subjects);setEvents(plan.events);setWeeks(plan.weeks);setTasks(plan.tasks);setCurriculum(plan.curriculum);setStorageBlocked(false);setStorageError('');setNotice('バックアップを復元しました')};

  const weekDays=useMemo(()=>{
    const mon=parseKey(weekStart);
    return WEEKDAYS.map((_,i)=>toKey(addDays(mon,i)));
  },[weekStart]);

  const hourSummary=useMemo(
    ()=>calculateHourSummary({subjects,weeks,grade:meta.grade,schoolYear:meta.schoolYear}),
    [subjects,weeks,meta.grade,meta.schoolYear]
  );

  const getCell=(dayKey,period)=>weeks[weekStart]?.days?.[dayKey]?.periods?.[period]||null;
  const getGyozen=(dayKey)=>weeks[weekStart]?.days?.[dayKey]?.gyozen?.text||'';

  const updateCell=(dayKey,period,data)=>{
    setWeeks(prev=>{
      const next=JSON.parse(JSON.stringify(prev));
      if(!next[weekStart])next[weekStart]={weekStart,grade:meta.grade,days:{}};
      if(!next[weekStart].days[dayKey])next[weekStart].days[dayKey]={gyozen:{text:''},periods:{}};
      next[weekStart].days[dayKey].periods[period]=data;
      return next;
    });
  };
  const updateGyozen=(dayKey,text)=>{
    setWeeks(prev=>{
      const next=JSON.parse(JSON.stringify(prev));
      if(!next[weekStart])next[weekStart]={weekStart,grade:meta.grade,days:{}};
      if(!next[weekStart].days[dayKey])next[weekStart].days[dayKey]={gyozen:{text:''},periods:{}};
      next[weekStart].days[dayKey].gyozen={text};
      return next;
    });
  };

  const handleDrop=(dayKey,period,subjectId=dragSubject)=>{
    if(!subjects.some(s=>s.id===subjectId))return;
    const existing=getCell(dayKey,period);
    if(existing?.subjectId&&existing.subjectId!==subjectId&&!confirm('このコマの教科とメモを新しい教科に置き換えますか？'))return;
    if(existing?.subjectId===subjectId){setDragSubject(null);return}
    updateCell(dayKey,period,{subjectId,unit:'',sub:'',items:'',memo:'',status:'planned',minutes:existing?.minutes||45,curriculumUnitId:null});
    setDragSubject(null);
  };

  const moveWeek=(delta)=>setWeekStart(toKey(addDays(parseKey(weekStart),delta*7)));

  const copyPrevWeek=()=>{
    const prevKey=toKey(addDays(parseKey(weekStart),-7));
    const prev=weeks[prevKey];
    if(!prev){alert('前の週のデータがありません');return}
    if(weeks[weekStart]&&!window.confirm('今週のデータを前週の内容で上書きします。よろしいですか？'))return;
    setWeeks(p=>{
      const next=JSON.parse(JSON.stringify(p));
      const copied=JSON.parse(JSON.stringify(prev));
      const newDays={};
      WEEKDAYS.forEach((_,i)=>{
        const oldDay=toKey(addDays(parseKey(prevKey),i));
        const newDay=weekDays[i];
        if(copied.days[oldDay])newDays[newDay]=copied.days[oldDay];
      });
      Object.entries(newDays).forEach(([date,day])=>PERIODS.forEach(p=>{
        const slot=day.periods[p];if(!slot)return;
        slot.status='planned';
        if(!curriculum.some(c=>c.grade===prev.grade&&c.schoolYear===schoolYearOf(date)&&c.units.some(u=>u.id===slot.curriculumUnitId)))slot.curriculumUnitId=null;
      }));
      next[weekStart]={weekStart,grade:prev.grade,days:newDays};
      return next;
    });
  };

  const addTask=()=>{
    if(!taskInput.trim())return;
    setTasks(p=>[...p,{id:uid(),text:taskInput.trim(),date:toKey(new Date()),done:false,createdAt:Date.now()}]);
    setTaskInput('');
  };
  const toggleTask=id=>setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
  const delTask=id=>setTasks(p=>p.filter(t=>t.id!==id));
  const todayKey=toKey(new Date());
  const todayTasks=tasks.filter(t=>t.date===todayKey);

  const handleImport=(preview,mode)=>{
    setEvents(prev=>mergeEvents(prev,preview,mode,meta.schoolYear));
    setShowExcel(false);
  };
  const importCurriculum=plan=>{
    setCurriculum(prev=>{
      const existing=prev.find(c=>c.id===plan.id);
      const next={...plan,units:plan.units.map(u=>({...u,resources:existing?.units.find(old=>old.id===u.id)?.resources||[]}))};
      return [...prev.filter(c=>c.id!==plan.id),next];
    });setShowExcel(false);
  };
  const addEvent=(date,event)=>setEvents(prev=>({...prev,[date]:[...(prev[date]||[]),event]}));
  const deleteEvent=(date,id)=>{if(confirm('この行事を端末内のカレンダーから削除しますか？'))setEvents(prev=>({...prev,[date]:(prev[date]||[]).filter(e=>e.id!==id)}))};
  const resourceUnit=resource?curriculum.find(c=>c.id===resource.planId)?.units.find(u=>u.id===resource.unitId):null;
  const weekGrade=weeks[weekStart]?.grade||meta.grade;

  const mon=parseKey(weekStart);
  const monthLabel=`${mon.getFullYear()}年 ${mon.getMonth()+1}月`;

  return(
    <div className="app-shell" style={{height:'100dvh',display:'flex',flexDirection:'column',overflow:'hidden'}}>

      <div className="no-print app-header" style={{flexShrink:0,background:'white',borderBottom:'1px solid #E5E7EB',padding:'8px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:20}}>📋</span>
          <div>
            <div style={{fontSize:15,fontWeight:'900',color:'#374151'}}>週案エディタ</div>
            <div style={{fontSize:9,color:'#9CA3AF'}}>{meta.grade}年{meta.className}組 {meta.teacherName&&`・${meta.teacherName}`}</div>
          </div>
        </div>
        <nav className="view-tabs" role="tablist" aria-label="画面">{[['week','週案'],['calendar','行事カレンダー'],['progress','時数・指導計画']].map(([id,label])=><button key={id} role="tab" aria-selected={view===id} onClick={()=>setView(id)}>{label}</button>)}</nav>
        <div className="week-controls" style={{display:'flex',alignItems:'center',gap:6}}>
          {view==='week'&&<><button title="前の週" aria-label="前の週" onClick={()=>moveWeek(-1)} style={{padding:'6px 10px',borderRadius:9,background:'#F3F4F6',color:'#6B7280',fontSize:13,fontWeight:'800'}}>◀</button>
          <div style={{textAlign:'center',minWidth:120}}>
            <div style={{fontSize:13,fontWeight:'900',color:'#374151'}}>{monthLabel}</div>
            <div style={{fontSize:10,color:'#9CA3AF'}}>{fmtMD(mon)}週</div>
          </div>
          <button title="次の週" aria-label="次の週" onClick={()=>moveWeek(1)} style={{padding:'6px 10px',borderRadius:9,background:'#F3F4F6',color:'#6B7280',fontSize:13,fontWeight:'800'}}>▶</button>
          <button onClick={copyPrevWeek} style={{padding:'6px 12px',borderRadius:9,background:'#EFF6FF',color:'#2563EB',fontSize:12,fontWeight:'800',marginLeft:4}}>前週コピー</button>
          <button onClick={()=>window.print()} style={{padding:'6px 12px',borderRadius:9,background:'#ECFDF5',color:'#059669',fontSize:12,fontWeight:'800'}}>🖨 印刷</button></>}
          <button title="設定・バックアップ" aria-label="設定・バックアップ" onClick={()=>setShowSettings(true)} style={{padding:'6px 10px',borderRadius:9,background:'#F3F4F6',color:'#6B7280',fontSize:13,fontWeight:'800'}}>⚙</button>
        </div>
      </div>
      {storageError&&<div className="notice error no-print" role="alert">{storageError} {storageBlocked&&'自動保存を停止しています。'} <button className="action" onClick={exportSavedOriginal}>保存原本の書き出し</button> <button className="action" onClick={()=>setShowSettings(true)}>バックアップ・復元</button></div>}
      {notice&&<div className="notice no-print" role="status">{notice} <button title="通知を閉じる" aria-label="通知を閉じる" onClick={()=>setNotice('')} style={{background:'none'}}>×</button></div>}
      {view==='week'&&weekGrade!==meta.grade&&<div className="notice no-print">表示中の週案は{weekGrade}年の記録です。時数集計は設定で選択した{meta.grade}年を対象にしています。</div>}

      <div className="app-body" style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>

        {view==='week'?<>

        <div className="no-print sidebar" style={{width:180,flexShrink:0,background:'white',borderRight:'1px solid #E5E7EB',display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{padding:'10px 10px 6px',flexShrink:0}}>
            <div style={{fontSize:10,fontWeight:'800',color:'#6B7280',marginBottom:6}}>教科</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {subjects.map(s=>(
                <button key={s.id} className="subj-chip" draggable aria-pressed={dragSubject===s.id}
                  onClick={()=>setDragSubject(dragSubject===s.id?null:s.id)}
                  onDragStart={e=>{setDragSubject(s.id);e.dataTransfer.setData('application/x-weekly-subject',s.id);e.dataTransfer.effectAllowed='copy'}}
                  onDragEnd={()=>setDragSubject(null)}
                  style={{padding:'5px 9px',borderRadius:6,background:`${s.color}33`,color:'#374151',outline:dragSubject===s.id?'2px solid #137F76':'none',fontSize:12,fontWeight:'800',cursor:'grab',userSelect:'none'}}>
                  {s.name}
                </button>
              ))}
            </div>
          </div>

          <div style={{height:1,background:'#F3F4F6',margin:'6px 10px',flexShrink:0}}/>

          <div className="sidebar-tasks" style={{padding:'4px 10px 6px',flexShrink:0}}>
            <div style={{fontSize:10,fontWeight:'800',color:'#9CA3AF',marginBottom:6}}>✅ 今日のタスク</div>
            <div style={{display:'flex',gap:4,marginBottom:6}}>
              <input value={taskInput} onChange={e=>setTaskInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}
                placeholder="タスクを追加" style={{flex:1,padding:'5px 7px',borderRadius:7,border:'1.5px solid #E5E7EB',fontSize:11,outline:'none',minWidth:0}}/>
              <button onClick={addTask} style={{padding:'5px 9px',borderRadius:7,background:'#FDCB6E',color:'#7C5E10',fontSize:12,fontWeight:'900'}}>＋</button>
            </div>
          </div>
          <div className="sidebar-tasks" style={{flex:1,overflowY:'auto',padding:'0 10px 10px',minHeight:48}}>
            {todayTasks.length===0&&<div style={{fontSize:10,color:'#D1D5DB',textAlign:'center',marginTop:12,fontStyle:'italic'}}>タスクはありません</div>}
            {todayTasks.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 6px',borderRadius:8,background:t.done?'#F0FDF4':'#F9FAFB',marginBottom:4}}>
                <input type="checkbox" checked={t.done} onChange={()=>toggleTask(t.id)} style={{accentColor:'#10AC84',flexShrink:0}}/>
                <span style={{flex:1,fontSize:11,color:t.done?'#9CA3AF':'#374151',textDecoration:t.done?'line-through':'none',lineHeight:1.3}}>{t.text}</span>
                <button onClick={()=>delTask(t.id)} style={{background:'none',color:'#D1D5DB',fontSize:13,padding:0,flexShrink:0}}>✕</button>
              </div>
            ))}
          </div>

          <div className="sidebar-counter"><HourCounterPanel summary={hourSummary} grade={meta.grade}/></div>

          <div style={{padding:10,flexShrink:0,borderTop:'1px solid #F3F4F6'}}>
            <button onClick={()=>setShowExcel('events')} style={{width:'100%',padding:9,borderRadius:6,background:'#EFF6FF',color:'#2563EB',fontSize:12,fontWeight:'800'}}>行事Excel取込</button>
          </div>
        </div>

        <div className="grid-wrap" style={{flex:1,padding:'8px 10px',overflow:'hidden',display:'flex',flexDirection:'column'}}>
          <div className="print-title">{meta.schoolYear}年度　{weekGrade}年{meta.className}組　週案　{weekStart}〜{weekDays[4]}　{meta.teacherName}</div>
          <div className="schedule-grid" style={{
            flex:1,display:'grid',
            gridTemplateColumns:`32px repeat(5,minmax(0,1fr))`,
            gridTemplateRows:`40px minmax(0,0.55fr) minmax(0,0.55fr) repeat(6,minmax(0,1fr))`,
            gap:3,minHeight:0,
          }}>
            <div style={{background:'#374151',borderRadius:'8px 0 0 0'}}/>
            {weekDays.map((dk,i)=>{
              const d=parseKey(dk);
              const isToday=dk===todayKey;
              return(
                <div key={dk} style={{background:isToday?'#4ECDC4':'#374151',borderRadius:i===4?'0 8px 0 0':0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'4px 0',color:'white'}}>
                  <span style={{fontSize:13,fontWeight:'900'}}>{WEEKDAYS[i]}</span>
                  <span style={{fontSize:10,opacity:0.85}}>{fmtMD(d)}</span>
                </div>
              );
            })}

            <div style={{background:'#FEF3C7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:'800',color:'#92400E'}}>行事</div>
            {weekDays.map(dk=>(
              <div key={dk} role="button" tabIndex={0} aria-label={`${dk} の行事を編集`} onClick={()=>setEventDate(dk)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setEventDate(dk)}}} style={{background:'#FFFBEB',borderRadius:4,padding:'2px 4px',overflow:'hidden',display:'flex',flexDirection:'column',justifyContent:'center',gap:1,cursor:'pointer'}}>
                {(events[dk]||[]).map((ev,i)=>(
                  <div key={i} title={ev.title} style={{fontSize:10,fontWeight:'700',color:'#854D0E',lineHeight:1.2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{ev.title}</div>
                ))}
              </div>
            ))}

            <div style={{background:'#E0E7FF',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:'800',color:'#3730A3'}}>業前</div>
            {weekDays.map(dk=>(
              <input key={dk} value={getGyozen(dk)} onChange={e=>updateGyozen(dk,e.target.value)}
                aria-label={`${dk} の業前`} placeholder="—" style={{background:'#EEF2FF',borderRadius:4,border:'none',padding:'2px 4px',fontSize:10,color:'#4338CA',fontWeight:'700',outline:'none',textAlign:'center'}}/>
            ))}

            {PERIODS.map(period=>(
              <React.Fragment key={period}>
                <div style={{background:'#F3F4F6',display:'flex',alignItems:'center',justifyContent:'center',borderRadius:period==='6'?'0 0 0 8px':0,fontSize:14,fontWeight:'900',color:'#6B7280'}}>{period}</div>
                {weekDays.map((dk,dayIdx)=>{
                  const cell=getCell(dk,period);
                  const subj=cell?subjects.find(s=>s.id===cell.subjectId):null;
                  return(
                    <div key={dk} role="button" tabIndex={0} aria-label={`${dk} ${period}限 ${subj?.name||'空きコマ'}`}
                      className="cell-drop"
                      onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}}
                      onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
                      onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleDrop(dk,period,e.dataTransfer.getData('application/x-weekly-subject')||dragSubject)}}
                      onClick={()=>dragSubject?handleDrop(dk,period):setEditCell({dayKey:dk,period,dayIdx,data:cell})}
                      onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dragSubject?handleDrop(dk,period):setEditCell({dayKey:dk,period,dayIdx,data:cell})}}}
                      style={{
                        background:subj?`${subj.color}22`:'#FAFBFC',
                        borderRadius:5,padding:'3px 5px',cursor:'pointer',overflow:'hidden',
                        border:subj?`1px solid ${subj.color}`:'1px solid #DCE1E8',
                        display:'flex',flexDirection:'column',justifyContent:'center',
                        position:'relative',
                      }}>
                      {cell?.subjectId?(
                        <>
                          <div style={{fontSize:12,fontWeight:'900',color:'#374151',lineHeight:1.2,overflowWrap:'anywhere'}}>{subj?.name||`未登録 (${cell.subjectId})`}</div>
                          {cell.status!=='planned'&&<span style={{fontSize:9,color:cell.status==='cancelled'?'#B91C1C':'#116655'}}>{cell.status==='done'?'実施済':'中止'}</span>}
                          {cell.unit&&<div title={cell.unit} style={{fontSize:10,color:'#374151',lineHeight:1.2,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cell.unit}</div>}
                          {cell.sub&&<div style={{fontSize:9,color:'#4B5563',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cell.sub}</div>}
                          {cell.items&&<div className="cell-items" title={cell.items} style={{fontSize:9,color:'#4B5563',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>持: {cell.items}</div>}
                          {cell.memo&&<div style={{position:'absolute',top:2,right:3,fontSize:9}} title={cell.memo}>📝</div>}
                        </>
                      ):(
                        <div className="empty-cell" style={{textAlign:'center',color:'#9CA3AF',fontSize:16}}>＋</div>
                      )}
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        </div>
        </>:view==='calendar'?<CalendarView key={meta.schoolYear} meta={meta} events={events} onImport={()=>setShowExcel('events')} onEdit={setEventDate}/>:<ProgressView key={`${meta.schoolYear}-${meta.grade}`} meta={meta} subjects={subjects} weeks={weeks} curriculum={curriculum} onImport={()=>setShowExcel('curriculum')} onResource={(planId,unitId)=>setResource({planId,unitId})}/>}
      </div>

      {editCell&&(
        <CellEditor cell={editCell} subjects={subjects} grade={weekGrade} curriculum={curriculum} schoolYear={schoolYearOf(editCell.dayKey)}
          onSave={(data)=>{updateCell(editCell.dayKey,editCell.period,data);setEditCell(null)}}
          onDelete={()=>{updateCell(editCell.dayKey,editCell.period,null);setEditCell(null)}}
          onClose={()=>setEditCell(null)}/>
      )}
      {showExcel&&<ExcelImportModal kind={showExcel} meta={meta} subjects={subjects} onClose={()=>setShowExcel(false)} onImport={showExcel==='curriculum'?importCurriculum:handleImport}/>}
      {showSettings&&<SettingsModal meta={meta} setMeta={setMeta} state={state} onRestore={restore} onClose={()=>setShowSettings(false)}/>}
      {eventDate&&<EventEditor date={eventDate} events={events} onAdd={addEvent} onDelete={deleteEvent} onClose={()=>setEventDate(null)}/>}
      {resourceUnit&&<ResourceEditor unit={resourceUnit} onClose={()=>setResource(null)} onSave={resources=>setCurriculum(prev=>prev.map(c=>c.id===resource.planId?{...c,units:c.units.map(u=>u.id===resource.unitId?{...u,resources}:u)}:c))}/>}
    </div>
  );
}

class AppErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null}}
  static getDerivedStateFromError(error){return {error}}
  render(){
    if(this.state.error)return <div style={{padding:24}}><h2>アプリを表示できませんでした</h2><p style={{margin:'12px 0'}}>保存データは削除していません。原本を書き出して確認できます。</p><button className="action" onClick={exportSavedOriginal}>保存原本の書き出し</button><button className="action" onClick={()=>location.reload()}>再読み込み</button></div>;
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>
</body>
</html>
